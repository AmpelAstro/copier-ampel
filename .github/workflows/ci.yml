name: CI

on:
  push:
  pull_request:

jobs:
  render-template:
    runs-on: ubuntu-latest
    env:
      POETRY_VERSION: 2.4.1
      COPIER_VERSION: 9.17.1
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: .template

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Load cached Poetry Binary
      id: cached-poetry-binary
      uses: actions/cache@v4
      with:
        path: ~/.local
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ env.POETRY_VERSION }}-${{ env.COPIER_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install Copier
      run: |
        pip install copier==${{ env.COPIER_VERSION }}

    - name: Render template with dummy values
      run: |
        copier copy .template . --trust -d project_name=dummy-project -d user_name=dummy-author -d user_email=nobody@nonesuch.co -d description="dummy description" --defaults

    - name: Lock dependencies
      run: |
        poetry lock

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
        # Restore cache with this prefix if not exact match with key
        # Note cache-hit returns false in this case, so the below step will run
        restore-keys: |
          venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction 

    - name: mypy
      run: |
        poetry run mypy

