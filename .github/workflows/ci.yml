name: CI

on:
  push:
  pull_request:

jobs:
  render-template:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Copier
      run: |
        python -m pip install --upgrade pip
        pip install copier poetry==2.4.1

    - name: Render template with dummy values
      run: |
        copier copy . rendered --trust -d project_name=dummy-project -d user_name=dummy-author -d user_email=nobody@nonesuch.co -d description="dummy description" --defaults
      
    - name: lock
      working-directory: rendered
      run: |
        poetry lock
