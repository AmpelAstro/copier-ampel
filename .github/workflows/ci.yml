name: CI

on:
    push:
    pull_request:

jobs:
    render-template:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Copier
              run: |
                  python -m pip install --upgrade pip
                  pip install copier

            - name: Render template with dummy values
              run: |
                  copier copy . rendered --trust -d project_name=dummy-project -d author_name=dummy-author -d description="dummy description"
