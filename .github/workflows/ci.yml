name: CI

on:
  push:
  pull_request:

jobs:
  render-template:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: .template

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Copier
      run: |
        python -m pip install --upgrade pip
        pip install copier

    - name: Render template with dummy values
      run: |
        copier copy .template . --trust -d project_name=dummy-project -d user_name=dummy-author -d user_email=nobody@nonesuch.co -d description="dummy description" --defaults

    - name: Set up environment
      uses: packetcoders/action-setup-cache-python-poetry@0d0be5577b30d85f3fa2d93a4beeda149520f120 # v1.2.0
      with:
        python-version: 3.11
        poetry-version: 2.4.1
        install-args: --all-extras --compile --sync
    
    - name: mypy
      run: |
        poetry run mypy

