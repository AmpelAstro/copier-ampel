plugin_name:
    type: str
    help: What is your Ampel plugin called?
    default: SomeNewObservatory

plugin_description:
    type: str
    help: A short description of your Ampel plugin.
    default: Some New Observatory support for the Ampel system.

plugin_org:
    type: str
    help: What is the organization or user name for your Ampel plugin?
    default: AmpelAstro

plugin_version:
    type: str
    help: What is the initial version of your Ampel plugin?
    default: 0.10.0a0

version_cap:
    type: str
    help: What is the maximum version of Ampel your plugin supports?
    default: "<0.11"

author_name:
    type: str
    help: What is the author's full name?

author_email:
    type: str
    help: What is the author's email address?

_exclude:
    - copier.yml
    - README.md
    - LICENSE
    - .git
